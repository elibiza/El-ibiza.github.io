<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cifrador Ibi</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="contenedor">
    <h1>Cifrador Ibi</h1>
    <textarea id="texto" placeholder="Escribe tu mensaje aquí..."></textarea>
    <label for="desplazamiento">Desplazamiento:</label>
    <input type="range" id="desplazamiento" min="1" max="25" value="3">
    <p id="resultado"></p>
  </div>
  <script src="index.js"></script>
</body>
</html>

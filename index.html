<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cifrador Ibi</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <h1>Cifrador Ibi.</h1>
        <textarea id="inputText" placeholder="Ingrese el texto"></textarea>
        <div class="controls">
            <input type="range" id="shiftRange" min="1" max="25" value="10">
            <span id="shiftValue">10</span>
        </div>
        <div class="output">
            <pre id="outputText"></pre>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
